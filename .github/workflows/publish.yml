name: Publish NuGet

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  validate:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    name: Validate tagged source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "Release ref must be a v-prefixed tag." >&2; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          source_version="$(python3 scripts/verify-release.py --print-source-version)"
          test "$version" = "$source_version"
      - name: Restore all locked dependency graphs
        run: bash scripts/restore-locked.sh
      - name: Build
        run: dotnet build FsMcp.slnx --configuration Release --no-restore --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:RepositoryCommit=${{ github.sha }} -p:SourceRevisionId=${{ github.sha }} -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test FsMcp.slnx --configuration Release --no-build --no-restore --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
      - name: Build examples
        run: bash scripts/build-examples.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "Release ref must be a v-prefixed tag." >&2; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          source_version="$(python3 scripts/verify-release.py --print-source-version)"
          test "$version" = "$source_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore all locked dependency graphs
        run: bash scripts/restore-locked.sh
      - name: Query NuGet vulnerability database
        run: dotnet package list --project FsMcp.slnx --vulnerable --include-transitive --format json --no-restore --source https://api.nuget.org/v3/index.json > nuget-audit.json
      - name: Enforce clean NuGet vulnerability audit
        run: python3 scripts/verify-nuget-audit.py nuget-audit.json --expected-projects 14
      - name: Build release assemblies
        run: dotnet build FsMcp.slnx --configuration Release --no-restore --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:RepositoryCommit=${{ github.sha }} -p:SourceRevisionId=${{ github.sha }} -p:ContinuousIntegrationBuild=true
      - name: Test release verifiers
        run: python3 scripts/test_release_verifiers.py
      - name: Pack
        run: bash scripts/pack-packages.sh ./nupkgs "${{ github.sha }}"
      - name: Verify package metadata
        run: python3 scripts/verify-release.py --package-dir ./nupkgs --expected-version "${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}"
      - name: Build clean package consumers
        run: python3 scripts/consumer-smoke.py --package-dir ./nupkgs --expected-version "${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}"
      - name: Extract release notes
        run: python3 scripts/extract-release-notes.py --changelog CHANGELOG.md --version "${{ steps.version.outputs.version }}" --output release-notes.md
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
      - name: NuGet login with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Neftedollar
      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: release-notes.md
          files: ./nupkgs/*.nupkg

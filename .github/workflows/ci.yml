name: CI

on:
  push:
    branches: [main, 'feature/*', 'codex/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore all locked dependency graphs
        shell: bash
        run: bash scripts/restore-locked.sh
      - name: Build
        run: dotnet build FsMcp.slnx --no-restore --configuration Release --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:RepositoryCommit=${{ github.sha }} -p:SourceRevisionId=${{ github.sha }} -p:ContinuousIntegrationBuild=true
      - name: Build examples
        shell: bash
        run: bash scripts/build-examples.sh
      - name: Test
        run: dotnet test FsMcp.slnx --configuration Release --no-build --no-restore --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-cobertura
          path: '**/coverage.cobertura.xml'
          if-no-files-found: error

  package-gate:
    name: Package and consumer gate
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore all locked dependency graphs
        run: bash scripts/restore-locked.sh
      - name: Query NuGet vulnerability database
        run: dotnet package list --project FsMcp.slnx --vulnerable --include-transitive --format json --no-restore --source https://api.nuget.org/v3/index.json > nuget-audit.json
      - name: Enforce clean NuGet vulnerability audit
        run: python3 scripts/verify-nuget-audit.py nuget-audit.json --expected-projects 14
      - name: Build release assemblies
        run: dotnet build FsMcp.slnx --no-restore --configuration Release --maxcpucount:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:RepositoryCommit=${{ github.sha }} -p:SourceRevisionId=${{ github.sha }} -p:ContinuousIntegrationBuild=true
      - name: Test release verifiers
        run: python3 scripts/test_release_verifiers.py
      - name: Read package version from the source
        id: version
        run: echo "version=$(python3 scripts/verify-release.py --print-source-version)" >> "$GITHUB_OUTPUT"
      - name: Pack the closed package set
        run: bash scripts/pack-packages.sh ./nupkgs "${{ github.sha }}"
      - name: Verify package metadata
        run: python3 scripts/verify-release.py --package-dir ./nupkgs --expected-version "${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}"
      - name: Build clean package consumers
        run: python3 scripts/consumer-smoke.py --package-dir ./nupkgs --expected-version "${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}"
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
